[package]
name = "rust_android_calculator"
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
eframe = { version = "0.35.0", default-features = false, features = [
  "default_fonts",
  "glow",
  "android-native-activity",
] }
android_logger = "0.15.1"
log = "0.4.33"
winit = { version = "0.30.13", default-features = false, features = ["android-native-activity"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[package.metadata.android]
package = "dev.rustcalc.android17"
apk_name = "RustCalculator-Android17"
build_targets = ["aarch64-linux-android"]
strip = "strip"

[package.metadata.android.sdk]
min_sdk_version = 37
target_sdk_version = 37

[package.metadata.android.application]
label = "Rust Calculator"
theme = "@android:style/Theme.Material.NoActionBar.Fullscreen"
extract_native_libs = true
uses_cleartext_traffic = false

[package.metadata.android.application.activity]
label = "Rust Calculator"
exported = true
launch_mode = "singleTask"
config_changes = "orientation|keyboardHidden|screenSize|screenLayout|uiMode"
resizeable_activity = true
