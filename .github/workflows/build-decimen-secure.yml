name: Build and verify hardened Decimen APK

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  UPSTREAM_COMMIT: 13e86c26a187882637015b9267bb0361d67f1033
  APK_NAME: decimen-optical-transfer-0.2.0-secure.apk

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Check out review workspace
        uses: actions/checkout@v4

      - name: Restore hardened source payload
        run: |
          mkdir -p payload
          cat secure-build/payload.b64.* | base64 --decode > "$RUNNER_TEMP/payload.tar.gz"
          tar -xzf "$RUNNER_TEMP/payload.tar.gz" -C payload
          test "$(find payload -type f | wc -l)" -ge 15

      - name: Check out audited upstream revision
        run: |
          git clone https://github.com/bashalarmistalt/decimen-optical-transfer.git source
          git -C source checkout --detach "$UPSTREAM_COMMIT"
          test "$(git -C source rev-parse HEAD)" = "$UPSTREAM_COMMIT"

      - name: Apply protocol and lifecycle hardening
        run: |
          cp payload/hardened/shared/*.ts source/shared/
          cp payload/hardened/send/*.ts source/send/
          cp payload/hardened/receive/*.ts source/receive/
          python3 - <<'PY'
          from pathlib import Path
          p = Path('source/receive/index.html')
          s = p.read_text()
          s = s.replace('<option value="30">30</option>', '<option value="30" selected>30</option>')
          s = s.replace('<option value="60" selected>60</option>', '<option value="60">60</option>')
          p.write_text(s)
          for name in ['index.html', 'send/index.html', 'receive/index.html']:
              q = Path('source') / name
              text = q.read_text()
              if 'name="referrer"' not in text:
                  text = text.replace('<meta charset="UTF-8" />', '<meta charset="UTF-8" />\n    <meta name="referrer" content="no-referrer" />')
              q.write_text(text)
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Audit, test, and build web application
        run: |
          cd source
          npm ci
          npm audit --audit-level=high
          sed -i 's#"../source/#"../../source/#g' ../payload/tests/core-test.ts
          node ../payload/tests/core-test.ts
          npm run build
          npm audit --json > ../npm-audit-hardened.json

      - name: Scan hardened TypeScript
        run: |
          python3 -m pip install --user semgrep
          export PATH="$HOME/.local/bin:$PATH"
          semgrep scan --config p/javascript --config p/typescript --error --json --output semgrep-hardened.json source/shared source/send source/receive

      - name: Create Android project and local assets
        run: |
          cp -a payload/android android
          mkdir -p android/app/src/main/assets
          cp -a source/dist/. android/app/src/main/assets/
          test -f android/app/src/main/assets/index.html
          test -f android/app/src/main/assets/send/index.html
          test -f android/app/src/main/assets/receive/index.html
          test "$(find android/app/src/main/assets -type f | wc -l)" -ge 8

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.0

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platforms and emulators
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platform-tools" \
            "emulator" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "system-images;android-35;google_apis;x86_64" \
            "system-images;android-36;google_apis;x86_64"

      - name: Generate isolated release signing identity
        shell: bash
        run: |
          set -euo pipefail
          PASS="$(openssl rand -hex 24)"
          KEYSTORE="$RUNNER_TEMP/decimen-secure.jks"
          keytool -genkeypair -noprompt \
            -keystore "$KEYSTORE" -storepass "$PASS" -keypass "$PASS" \
            -alias decimen-secure -keyalg RSA -keysize 3072 -sigalg SHA256withRSA \
            -validity 3650 -dname "CN=Decimen Secure Build, OU=Local Verification, O=Decimen, C=DE"
          {
            echo "DECIMEN_KEYSTORE=$KEYSTORE"
            echo "DECIMEN_STORE_PASSWORD=$PASS"
            echo "DECIMEN_KEY_PASSWORD=$PASS"
          } >> "$GITHUB_ENV"

      - name: Lint and build signed release APK
        run: |
          gradle -p android lintRelease testReleaseUnitTest assembleRelease --no-daemon --stacktrace
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/$APK_NAME"

      - name: Verify manifest, package, signature, and native surface
        shell: bash
        run: |
          set -euo pipefail
          APK="out/$APK_NAME"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK" | tee out/zipalign.txt
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee out/signature.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee out/badging.txt
          "$BUILD_TOOLS/aapt" dump permissions "$APK" | tee out/permissions.txt
          grep -q "package: name='app.decimen.opticaltransfer.secure'" out/badging.txt
          grep -q "targetSdkVersion:'36'" out/badging.txt
          grep -q "sdkVersion:'28'" out/badging.txt
          grep -q "android.permission.CAMERA" out/permissions.txt
          ! grep -q "android.permission.INTERNET" out/permissions.txt
          test "$(grep -c "uses-permission:" out/permissions.txt)" -eq 1
          if unzip -Z1 "$APK" | grep -qE '^lib/.+\\.so$'; then
            echo "Unexpected native library in architecture-neutral APK" >&2
            exit 1
          fi
          unzip -t "$APK" | tee out/unzip-test.txt
          sha256sum "$APK" | tee out/SHA256SUMS.txt

      - name: Prepare emulator tooling
        run: |
          python3 -m pip install --user pillow
          sudo chmod 666 /dev/kvm || true

      - name: Verify on Android 15 / API 35 (LineageOS 22.2 base)
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"
          echo no | avdmanager create avd --force -n decimen35 -k "system-images;android-35;google_apis;x86_64" --device "pixel_2"
          emulator -avd decimen35 -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back virtualscene -camera-front emulated -wipe-data > out/emulator-api35.log 2>&1 &
          EMU_PID=$!
          trap 'kill "$EMU_PID" 2>/dev/null || true; adb emu kill 2>/dev/null || true' EXIT
          TEST_OUTPUT=out/api35 python3 payload/scripts/emulator_test.py "out/$APK_NAME"
          python3 payload/scripts/check_sender_image.py out/api35/sender.png | tee out/api35/qr-check.txt
          adb logcat -d -t 2500 > out/api35/logcat.txt
          ! grep -E "FATAL EXCEPTION|Process: app.decimen.opticaltransfer.secure.*crash" out/api35/logcat.txt
          adb emu kill || true
          wait "$EMU_PID" || true
          trap - EXIT

      - name: Verify on Android 16 / API 36
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"
          adb kill-server || true
          echo no | avdmanager create avd --force -n decimen36 -k "system-images;android-36;google_apis;x86_64" --device "pixel_2"
          emulator -avd decimen36 -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back virtualscene -camera-front emulated -wipe-data > out/emulator-api36.log 2>&1 &
          EMU_PID=$!
          trap 'kill "$EMU_PID" 2>/dev/null || true; adb emu kill 2>/dev/null || true' EXIT
          TEST_OUTPUT=out/api36 python3 payload/scripts/emulator_test.py "out/$APK_NAME"
          python3 payload/scripts/check_sender_image.py out/api36/sender.png | tee out/api36/qr-check.txt
          adb logcat -d -t 2500 > out/api36/logcat.txt
          ! grep -E "FATAL EXCEPTION|Process: app.decimen.opticaltransfer.secure.*crash" out/api36/logcat.txt
          adb emu kill || true
          wait "$EMU_PID" || true
          trap - EXIT

      - name: Write verification report
        shell: bash
        run: |
          set -euo pipefail
          APK="out/$APK_NAME"
          AUDIT_TOTAL="$(python3 -c 'import json; print(json.load(open("npm-audit-hardened.json"))["metadata"]["vulnerabilities"]["total"])')"
          SEMGREP_TOTAL="$(python3 -c 'import json; print(len(json.load(open("semgrep-hardened.json"))["results"]))')"
          CERT="$(grep -m1 'Signer #1 certificate SHA-256 digest:' out/signature.txt | sed 's/.*: //')"
          HASH="$(cut -d' ' -f1 out/SHA256SUMS.txt)"
          cat > out/VERIFICATION.txt <<EOF
          Decimen Optical Transfer 0.2.0-secure
          Audited upstream commit: $UPSTREAM_COMMIT
          Build environment: AGP 9.3.1, Gradle 9.5.0, JDK 17, compile/target SDK 36
          Compatibility: min SDK 28; Android 15/API 35 full emulator test passed; Android 16/API 36 full emulator test passed
          Web tests: 512 KiB and 2 MiB fountain transfers with loss/duplicates passed; malformed-frame bounds passed
          Dependency audit vulnerabilities: $AUDIT_TOTAL
          Semgrep findings in hardened TypeScript: $SEMGREP_TOTAL
          Permissions: CAMERA only; no INTERNET, microphone, storage, location, or Bluetooth permission
          Native code: none (no APK lib/*.so entries); Java/WebView + bundled JavaScript/WASM assets
          WebView: local appassets origin only, external navigation blocked, file/content access disabled, cleartext blocked, cookies disabled, camera origin/resource allowlisted
          Data: backups and device transfer disabled
          APK SHA-256: $HASH
          Signing certificate SHA-256: $CERT
          Physical-device limitation: automated verification cannot reproduce the exact optics/camera firmware of every Galaxy Tab S5e, but the relevant Android 15 runtime path was tested.
          EOF
          cat out/VERIFICATION.txt

      - name: Upload verified APK and evidence
        uses: actions/upload-artifact@v4
        with:
          name: decimen-secure-verified
          path: |
            out/
            npm-audit-hardened.json
            semgrep-hardened.json
            android/app/build/reports/lint-results-release.html
            android/app/build/reports/lint-results-release.txt
          if-no-files-found: error
          retention-days: 7
