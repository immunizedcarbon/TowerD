name: Build Rust Calculator Android 17 v2

on:
  push:
    branches:
      - "chatgpt/rust-calculator-android17"
    paths:
      - "rust-calculator-android17/**"
      - ".github/workflows/build-rust-calculator-android17-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Bootstrap Android 17 SDK and NDK
        shell: bash
        run: |
          set -euxo pipefail

          SDK_ROOT="${RUNNER_TEMP}/android-sdk"
          TOOLS_ZIP="${RUNNER_TEMP}/commandlinetools.zip"
          TOOLS_TMP="${RUNNER_TEMP}/commandlinetools"

          mkdir -p "${SDK_ROOT}/cmdline-tools/latest" "${TOOLS_TMP}"
          curl --fail --location --retry 5 \
            --output "${TOOLS_ZIP}" \
            "https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip"
          echo "4e4c464f113d0fcdce0e8d0c78cc00c8023d4a0cb1d12c6848b2e9e1fcbc37a0  ${TOOLS_ZIP}" | sha256sum --check
          unzip -q "${TOOLS_ZIP}" -d "${TOOLS_TMP}"
          mv "${TOOLS_TMP}/cmdline-tools/"* "${SDK_ROOT}/cmdline-tools/latest/"

          SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "${SDKMANAGER}" --sdk_root="${SDK_ROOT}" --licenses >/dev/null || true
          "${SDKMANAGER}" --sdk_root="${SDK_ROOT}" \
            "platform-tools" \
            "platforms;android-37" \
            "build-tools;37.0.0" \
            "ndk;29.0.14206865"

          echo "ANDROID_HOME=${SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_ROOT=${SDK_ROOT}/ndk/29.0.14206865" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_HOME=${SDK_ROOT}/ndk/29.0.14206865" >> "${GITHUB_ENV}"
          echo "${SDK_ROOT}/platform-tools" >> "${GITHUB_PATH}"

      - name: Install cargo-apk
        shell: bash
        run: |
          set -euxo pipefail
          cargo install \
            --git https://github.com/parasyte/cargo-apk.git \
            --rev 282639508eeed7d73f2e1eaeea042da2716436d5 \
            cargo-apk

      - name: Build signed installable APK
        shell: bash
        working-directory: rust-calculator-android17
        run: |
          set -euxo pipefail
          cargo apk build --lib
          find target -type f -name '*.apk' -print

      - name: Verify and collect APK
        shell: bash
        working-directory: rust-calculator-android17
        run: |
          set -euxo pipefail
          mkdir -p dist
          APK="$(find target -type f -name '*.apk' | head -n 1)"
          test -n "${APK}"
          cp "${APK}" dist/RustCalculator-Android17.apk

          "${ANDROID_HOME}/build-tools/37.0.0/apksigner" verify \
            --verbose \
            --print-certs \
            dist/RustCalculator-Android17.apk \
            | tee dist/signature-verification.txt

          "${ANDROID_HOME}/build-tools/37.0.0/aapt" dump badging \
            dist/RustCalculator-Android17.apk \
            | tee dist/apk-badging.txt

          unzip -l dist/RustCalculator-Android17.apk \
            | tee dist/apk-contents.txt

          sha256sum dist/RustCalculator-Android17.apk \
            | tee dist/RustCalculator-Android17.apk.sha256

      - name: Upload APK and verification reports
        uses: actions/upload-artifact@v4
        with:
          name: RustCalculator-Android17
          path: rust-calculator-android17/dist/*
          if-no-files-found: error
          retention-days: 7
