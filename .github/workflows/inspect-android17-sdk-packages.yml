name: Inspect Android 17 SDK packages

on:
  push:
    branches:
      - "chatgpt/rust-calculator-android17"
    paths:
      - ".github/workflows/inspect-android17-sdk-packages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Android CLI
        shell: bash
        run: |
          set -euxo pipefail
          curl --fail --location --retry 5 \
            "https://dl.google.com/android/cli/latest/linux_x86_64/install.sh" \
            | bash
          test -x "${HOME}/.local/bin/android"

      - name: List Android 17 packages
        shell: bash
        run: |
          set -euxo pipefail
          SDK_ROOT="${RUNNER_TEMP}/android-sdk"
          mkdir -p "${SDK_ROOT}"
          "${HOME}/.local/bin/android" --no-metrics --sdk="${SDK_ROOT}" sdk list 'platforms/.*' --all --all-versions --canary | tee android-platform-packages.txt
          grep -Ei '37|cinnamon|platforms/' android-platform-packages.txt || true
