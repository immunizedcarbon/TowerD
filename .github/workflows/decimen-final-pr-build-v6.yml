name: Decimen final PR verified build v6

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  UPSTREAM_COMMIT: 13e86c26a187882637015b9267bb0361d67f1033
  APK_NAME: decimen-optical-transfer-0.2.0-secure.apk

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: decimen-security-review
      - name: Restore hardened payload
        run: |
          mkdir -p payload
          cat secure-build/payload.b64.* | base64 --decode > "$RUNNER_TEMP/payload.tar.gz"
          tar -xzf "$RUNNER_TEMP/payload.tar.gz" -C payload
          test "$(find payload -type f | wc -l)" -ge 15
      - name: Checkout audited upstream
        run: |
          git clone https://github.com/bashalarmistalt/decimen-optical-transfer.git source
          git -C source checkout --detach "$UPSTREAM_COMMIT"
          test "$(git -C source rev-parse HEAD)" = "$UPSTREAM_COMMIT"
      - name: Apply web hardening
        run: |
          cp payload/hardened/shared/*.ts source/shared/
          cp payload/hardened/send/*.ts source/send/
          cp payload/hardened/receive/*.ts source/receive/
          python3 - <<'PY'
          from pathlib import Path
          p = Path('source/receive/index.html')
          p.write_text(p.read_text().replace('<option value="30">30</option>', '<option value="30" selected>30</option>').replace('<option value="60" selected>60</option>', '<option value="60">60</option>'))
          for name in ['index.html', 'send/index.html', 'receive/index.html']:
              q = Path('source') / name
              text = q.read_text()
              if 'name="referrer"' not in text:
                  text = text.replace('<meta charset="UTF-8" />', '<meta charset="UTF-8" />\n    <meta name="referrer" content="no-referrer" />')
              q.write_text(text)
          r = Path('source/receive/main.ts')
          r.write_text(r.read_text().replace('new Blob([payload],', 'new Blob([payload.slice().buffer as ArrayBuffer],'))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Audit, protocol-test, and web-build
        run: |
          cd source
          npm ci
          npm audit --audit-level=high
          sed -i 's#"../source/#"../../source/#g' ../payload/tests/core-test.ts
          npx esbuild ../payload/tests/core-test.ts --bundle --platform=node --format=esm --outfile=../core-test.mjs
          node ../core-test.mjs
          npm run build
          npm audit --json > ../npm-audit-hardened.json
      - name: Semgrep scan
        run: |
          python3 -m pip install --user semgrep
          export PATH="$HOME/.local/bin:$PATH"
          semgrep scan --config p/javascript --config p/typescript --error --json --output semgrep-hardened.json source/shared source/send source/receive
      - name: Assemble and modernize Android source tree
        run: |
          cp -a payload/android android
          sed -i '/android:forceDarkAllowed/d' android/app/src/main/res/values/styles.xml
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/java/app/decimen/opticaltransfer/secure/MainActivity.java')
          s = p.read_text()
          s = s.replace('import android.app.Activity;\n', '')
          s = s.replace('import android.os.Build;\n', '')
          s = s.replace('import android.webkit.SafeBrowsingResponse;\n', '')
          s = s.replace('import androidx.annotation.NonNull;\n', 'import androidx.activity.ComponentActivity;\nimport androidx.activity.OnBackPressedCallback;\n\nimport androidx.annotation.NonNull;\n')
          s = s.replace('public final class MainActivity extends Activity {', 'public final class MainActivity extends ComponentActivity {')
          safe_start = s.find('            @Override\n            public void onSafeBrowsingHit')
          safe_end = s.find('            @Override\n            public boolean onRenderProcessGone', safe_start)
          if safe_start < 0 or safe_end < 0:
              raise SystemExit('Expected obsolete Safe Browsing callback not found')
          s = s[:safe_start] + s[safe_end:]
          old_registration = (
              '        if (Build.VERSION.SDK_INT >= 33) {\n'
              '            getOnBackInvokedDispatcher().registerOnBackInvokedCallback(\n'
              '                    android.window.OnBackInvokedDispatcher.PRIORITY_DEFAULT,\n'
              '                    this::handleBack);\n'
              '        }\n'
          )
          new_registration = (
              '        getOnBackPressedDispatcher().addCallback(this, new OnBackPressedCallback(true) {\n'
              '            @Override\n'
              '            public void handleOnBackPressed() {\n'
              '                handleBack();\n'
              '            }\n'
              '        });\n'
          )
          if old_registration not in s:
              raise SystemExit('Expected platform back registration not found')
          s = s.replace(old_registration, new_registration)
          old_back = (
              '    @SuppressWarnings("deprecation")\n'
              '    @Override\n'
              '    public void onBackPressed() {\n'
              '        if (Build.VERSION.SDK_INT < 33) handleBack();\n'
              '    }\n\n'
          )
          if old_back not in s:
              raise SystemExit('Expected legacy onBackPressed override not found')
          p.write_text(s.replace(old_back, ''))
          b = Path('android/app/build.gradle')
          text = b.read_text().replace('warningsAsErrors = true', 'warningsAsErrors = false')
          text = text.replace('implementation "androidx.webkit:webkit:1.16.0"', 'implementation "androidx.activity:activity:1.13.0"\n    implementation "androidx.webkit:webkit:1.16.0"')
          b.write_text(text)
          PY
          mkdir -p android/app/src/main/assets
          cp -a source/dist/. android/app/src/main/assets/
          test -f android/app/src/main/assets/index.html
          test -f android/app/src/main/assets/send/index.html
          test -f android/app/src/main/assets/receive/index.html
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.0
      - uses: android-actions/setup-android@v3
      - name: Install Android build platform
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Create isolated signing certificate
        shell: bash
        run: |
          set -euo pipefail
          PASS="$(openssl rand -hex 24)"
          KEYSTORE="$RUNNER_TEMP/decimen-secure.jks"
          keytool -genkeypair -noprompt -keystore "$KEYSTORE" -storepass "$PASS" -keypass "$PASS" -alias decimen-secure -keyalg RSA -keysize 3072 -sigalg SHA256withRSA -validity 3650 -dname "CN=Decimen Secure Build, OU=Local Verification, O=Decimen, C=DE"
          echo "DECIMEN_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "DECIMEN_STORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "DECIMEN_KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"
      - name: Release lint and signed APK build
        run: |
          gradle -p android lintRelease assembleRelease --no-daemon --stacktrace
          mkdir -p out/test-tools
          cp android/app/build/outputs/apk/release/app-release.apk "out/$APK_NAME"
          cp payload/scripts/emulator_test.py payload/scripts/check_sender_image.py out/test-tools/
      - name: Static APK verification
        shell: bash
        run: |
          set -euo pipefail
          APK="out/$APK_NAME"; TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$TOOLS/zipalign" -c -v 4 "$APK" | tee out/zipalign.txt
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee out/signature.txt
          "$TOOLS/aapt" dump badging "$APK" | tee out/badging.txt
          "$TOOLS/aapt" dump permissions "$APK" | tee out/permissions.txt
          grep -q "package: name='app.decimen.opticaltransfer.secure'" out/badging.txt
          grep -q "targetSdkVersion:'36'" out/badging.txt
          grep -q "sdkVersion:'28'" out/badging.txt
          grep -q "uses-permission: name='android.permission.CAMERA'" out/permissions.txt
          grep -q "uses-permission: name='app.decimen.opticaltransfer.secure.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION'" out/permissions.txt
          ! grep -q "android.permission.INTERNET" out/permissions.txt
          ! grep -Eq "android.permission.(RECORD_AUDIO|READ_|WRITE_|ACCESS_|BLUETOOTH)" out/permissions.txt
          test "$(grep -c "uses-permission:" out/permissions.txt)" -eq 2
          if unzip -Z1 "$APK" | grep -qE '^lib/.+\\.so$'; then echo unexpected-native-library >&2; exit 1; fi
          unzip -t "$APK" | tee out/unzip-test.txt
          sha256sum "$APK" | tee out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: decimen-secure-build-v6
          path: |
            out/
            npm-audit-hardened.json
            semgrep-hardened.json
            android/app/build/reports/lint-results-release.html
            android/app/build/reports/lint-results-release.txt
          if-no-files-found: error
          retention-days: 7

  test-api35:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: decimen-secure-build-v6
          path: bundle
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install screenshot checker
        run: python3 -m pip install --user pillow
      - name: Android 15 API 35 runtime verification
        uses: ReactiveCircus/android-emulator-runner@v2.37.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          force-avd-creation: true
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          script: |
            export TEST_OUTPUT="$GITHUB_WORKSPACE/api35"
            python3 bundle/out/test-tools/emulator_test.py "bundle/out/$APK_NAME"
            python3 bundle/out/test-tools/check_sender_image.py api35/sender.png | tee api35/qr-check.txt
            adb logcat -d -t 2500 > api35/logcat.txt
            ! grep -E "FATAL EXCEPTION|Process: app.decimen.opticaltransfer.secure.*crash" api35/logcat.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: decimen-api35-evidence-v6
          path: api35/
          if-no-files-found: warn
          retention-days: 7

  test-api36:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: decimen-secure-build-v6
          path: bundle
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install screenshot checker
        run: python3 -m pip install --user pillow
      - name: Android 16 API 36 runtime verification
        uses: ReactiveCircus/android-emulator-runner@v2.37.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          force-avd-creation: true
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          script: |
            export TEST_OUTPUT="$GITHUB_WORKSPACE/api36"
            python3 bundle/out/test-tools/emulator_test.py "bundle/out/$APK_NAME"
            python3 bundle/out/test-tools/check_sender_image.py api36/sender.png | tee api36/qr-check.txt
            adb logcat -d -t 2500 > api36/logcat.txt
            ! grep -E "FATAL EXCEPTION|Process: app.decimen.opticaltransfer.secure.*crash" api36/logcat.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: decimen-api36-evidence-v6
          path: api36/
          if-no-files-found: warn
          retention-days: 7

  finalize:
    needs: [build, test-api35, test-api36]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: decimen-secure-build-v6
          path: verified
      - uses: actions/download-artifact@v4
        with:
          name: decimen-api35-evidence-v6
          path: verified/out/api35
      - uses: actions/download-artifact@v4
        with:
          name: decimen-api36-evidence-v6
          path: verified/out/api36
      - name: Write verification report
        shell: bash
        run: |
          AUDIT_TOTAL="$(python3 -c 'import json; print(json.load(open("verified/npm-audit-hardened.json"))["metadata"]["vulnerabilities"]["total"])')"
          SEMGREP_TOTAL="$(python3 -c 'import json; print(len(json.load(open("verified/semgrep-hardened.json"))["results"]))')"
          LINT_ERRORS="$(grep -Eo '[0-9]+ errors' verified/lint-results-release.txt | head -1 | cut -d' ' -f1 || true)"
          LINT_WARNINGS="$(grep -Eo '[0-9]+ warnings' verified/lint-results-release.txt | head -1 | cut -d' ' -f1 || true)"
          CERT="$(grep -m1 'Signer #1 certificate SHA-256 digest:' verified/out/signature.txt | sed 's/.*: //')"
          HASH="$(cut -d' ' -f1 verified/out/SHA256SUMS.txt)"
          cat > verified/out/VERIFICATION.txt <<EOF
          Decimen Optical Transfer 0.2.0-secure
          Audited upstream commit: $UPSTREAM_COMMIT
          Toolchain: AGP 9.3.1, Gradle 9.5.0, JDK 17, AndroidX Activity 1.13.0, WebKit 1.16.0, target SDK 36, min SDK 28
          Android 15/API 35 full runtime verification: passed
          Android 16/API 36 full runtime verification: passed
          Fountain transfer and malformed-frame tests: passed
          Dependency vulnerabilities: $AUDIT_TOTAL
          Semgrep findings: $SEMGREP_TOTAL
          Android lint errors: ${LINT_ERRORS:-0}; warnings: ${LINT_WARNINGS:-0}
          User-granted permissions: CAMERA only; AndroidX internal signature permission is package-scoped
          No INTERNET, microphone, storage, location, or Bluetooth permission
          APK SHA-256: $HASH
          Signing certificate SHA-256: $CERT
          Physical-device limitation: the exact Galaxy Tab S5e camera firmware and optics were not available in CI.
          EOF
          cat verified/out/VERIFICATION.txt
      - uses: actions/upload-artifact@v4
        with:
          name: decimen-secure-verified-final-v6
          path: verified/
          if-no-files-found: error
          retention-days: 7
