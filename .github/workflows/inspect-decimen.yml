name: Inspect Decimen Source

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out review workspace
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Clone upstream source
        run: |
          git clone --depth 1 https://github.com/bashalarmistalt/decimen-optical-transfer.git source
          git -C source rev-parse HEAD | tee source-commit.txt
          find source -type f -not -path '*/.git/*' -printf '%P\n' | sort | tee source-files.txt

      - name: Install and build upstream application
        working-directory: source
        run: |
          npm ci
          npm run build

      - name: Capture dependency audit
        run: |
          cd source
          npm audit --json > ../npm-audit.json || true
          npm ls --all --json > ../npm-dependency-tree.json || true

      - name: Run Semgrep security scan
        run: |
          python3 -m pip install --user semgrep
          export PATH="$HOME/.local/bin:$PATH"
          semgrep scan --config p/javascript --config p/typescript --json --output semgrep.json source || true

      - name: Archive review inputs
        run: |
          tar --exclude='source/.git' --exclude='source/node_modules' -czf decimen-source.tar.gz source
          sha256sum decimen-source.tar.gz > decimen-source.tar.gz.sha256

      - name: Upload review bundle
        uses: actions/upload-artifact@v4
        with:
          name: decimen-source-review
          path: |
            decimen-source.tar.gz
            decimen-source.tar.gz.sha256
            source-commit.txt
            source-files.txt
            npm-audit.json
            npm-dependency-tree.json
            semgrep.json
          if-no-files-found: error
          retention-days: 3
