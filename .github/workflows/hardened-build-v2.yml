name: Hardened Decimen APK v2

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hardened-decimen-v2-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '9.5.0'
  ANDROID_PLATFORM: '36'
  ANDROID_BUILD_TOOLS: '36.0.0'

jobs:
  build:
    name: Verified release build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out verification workspace
        uses: actions/checkout@v4

      - name: Reconstruct pinned and reviewed sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir project
          git clone --filter=blob:none https://github.com/bashalarmistalt/decimen-optical-transfer.git project/web
          git -C project/web checkout 13e86c26a187882637015b9267bb0361d67f1033

          cat web-hardening.patch.gz.b64.part* > "$RUNNER_TEMP/web-hardening.patch.gz.b64"
          echo 'cbbada18ed58aafb7348d319a24ef30af428cc2316db6e6eaac04f0106cf6e66  '"$RUNNER_TEMP/web-hardening.patch.gz.b64" | sha256sum -c -
          base64 --decode "$RUNNER_TEMP/web-hardening.patch.gz.b64" | gzip -dc > "$RUNNER_TEMP/web-hardening.patch"
          echo '6a0e0809e627d544882eb4d72bffad76b6a12b4ca6cf4205f283c1646923098d  '"$RUNNER_TEMP/web-hardening.patch" | sha256sum -c -
          git -C project/web apply --check "$RUNNER_TEMP/web-hardening.patch"
          git -C project/web apply "$RUNNER_TEMP/web-hardening.patch"

          cat android-project.tar.gz.b64.part* > "$RUNNER_TEMP/android-project.tar.gz.b64"
          echo '35a871306bc02dba336a656ab0a28c2dbd603e7c14e8320b4a969260b6ba3f6e  '"$RUNNER_TEMP/android-project.tar.gz.b64" | sha256sum -c -
          base64 --decode "$RUNNER_TEMP/android-project.tar.gz.b64" > "$RUNNER_TEMP/android-project.tar.gz"
          echo 'f09f0ebc62cb276829c6f7673103b999259d54e9768398fbd4eb795264e9da37  '"$RUNNER_TEMP/android-project.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/android-project.tar.gz" -C project
          patch -d project -p1 < android-test-fix.patch

          test -f project/web/package-lock.json
          test -f project/android/app/src/main/AndroidManifest.xml
          test -f project/VERIFICATION.md

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: project/web/package-lock.json

      - name: Type-check, audit and build web application
        working-directory: project/web
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run check
          npm run build
          npm audit --json > ../npm-audit.json || true
          node - <<'NODE'
          const report = require('../npm-audit.json');
          const v = report.metadata?.vulnerabilities ?? {};
          const total = (v.low || 0) + (v.moderate || 0) + (v.high || 0) + (v.critical || 0);
          console.log('npm vulnerability summary:', v);
          if (total !== 0) process.exit(1);
          NODE

      - name: Static source security scan
        shell: bash
        run: |
          set -euo pipefail
          pipx run semgrep scan \
            --config p/default \
            --json \
            --exclude 'project/web/node_modules' \
            --exclude 'project/web/dist' \
            project/web project/android/app/src > project/semgrep.json
          python - <<'PY'
          import json
          report = json.load(open('project/semgrep.json', encoding='utf-8'))
          print('Semgrep findings:', len(report.get('results', [])))
          print('Semgrep errors:', len(report.get('errors', [])))
          if report.get('errors'):
              raise SystemExit('Semgrep returned scan errors')
          PY

      - name: Package local web assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf project/android/app/src/main/assets/www
          mkdir -p project/android/app/src/main/assets/www
          cp -a project/web/dist/. project/android/app/src/main/assets/www/
          test -f project/android/app/src/main/assets/www/index.html
          test -f project/android/app/src/main/assets/www/send/index.html
          test -f project/android/app/src/main/assets/www/receive/index.html

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Generate isolated release key
        shell: bash
        run: |
          set -euo pipefail
          PASSWORD=$(openssl rand -hex 24)
          echo "::add-mask::$PASSWORD"
          KEYSTORE="$RUNNER_TEMP/decimen-release.jks"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE" \
            -storepass "$PASSWORD" \
            -keypass "$PASSWORD" \
            -alias decimen \
            -keyalg RSA \
            -keysize 3072 \
            -sigalg SHA256withRSA \
            -validity 10000 \
            -dname "CN=Decimen Local Release, OU=Verified Build, O=Open Source, C=DE"
          {
            echo "DECIMEN_KEYSTORE=$KEYSTORE"
            echo "DECIMEN_STORE_PASSWORD=$PASSWORD"
            echo "DECIMEN_KEY_ALIAS=decimen"
            echo "DECIMEN_KEY_PASSWORD=$PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Lint, compile tests and build signed APK
        working-directory: project/android
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace \
            :app:lintRelease \
            :app:assembleDebug \
            :app:assembleDebugAndroidTest \
            :app:assembleRelease

      - name: Verify APK security properties
        shell: bash
        run: |
          set -euo pipefail
          APK=project/android/app/build/outputs/apk/release/app-release.apk
          DEBUG_APK=project/android/app/build/outputs/apk/debug/app-debug.apk
          TEST_APK=project/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          test -s "$APK"
          test -s "$DEBUG_APK"
          test -s "$TEST_APK"

          BUILD_TOOLS="$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}"
          ANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee project/apksigner-report.txt
          "$ANALYZER" apk summary "$APK" | tee project/apk-summary.txt
          "$ANALYZER" manifest permissions "$APK" | tee project/manifest-permissions.txt
          "$ANALYZER" manifest debuggable "$APK" | tee project/manifest-debuggable.txt
          "$ANALYZER" manifest min-sdk "$APK" | tee project/manifest-min-sdk.txt
          "$ANALYZER" manifest target-sdk "$APK" | tee project/manifest-target-sdk.txt

          ! grep -q 'android.permission.INTERNET' project/manifest-permissions.txt
          grep -q 'android.permission.CAMERA' project/manifest-permissions.txt
          grep -qx 'false' project/manifest-debuggable.txt
          grep -qx '35' project/manifest-min-sdk.txt
          grep -qx '36' project/manifest-target-sdk.txt
          if unzip -Z1 "$APK" | grep -q '^lib/'; then
            echo 'Unexpected native ABI library found.' >&2
            exit 1
          fi
          unzip -Z1 "$APK" | grep -q 'assets/www/index.html'
          unzip -Z1 "$APK" | grep -q 'assets/www/send/index.html'
          unzip -Z1 "$APK" | grep -q 'assets/www/receive/index.html'
          unzip -Z1 "$APK" | grep -Eq 'zxing_reader.*\.wasm'

      - name: Collect verified build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact/reports
          cp project/android/app/build/outputs/apk/release/app-release.apk \
            artifact/Decimen-Optical-Transfer-0.2.0-hardened.apk
          cp project/android/app/build/outputs/apk/debug/app-debug.apk artifact/app-debug.apk
          cp project/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk \
            artifact/app-debug-androidTest.apk
          cp project/npm-audit.json project/semgrep.json project/apksigner-report.txt \
            project/apk-summary.txt project/manifest-permissions.txt \
            project/manifest-debuggable.txt project/manifest-min-sdk.txt \
            project/manifest-target-sdk.txt artifact/reports/
          cp project/VERIFICATION.md artifact/
          cp -a project/android/app/build/reports/lint-results-release.* artifact/reports/ || true
          (cd artifact && sha256sum Decimen-Optical-Transfer-0.2.0-hardened.apk > SHA256SUMS.txt)
          cat artifact/SHA256SUMS.txt

      - name: Upload verified build
        uses: actions/upload-artifact@v4
        with:
          name: decimen-hardened-v2
          path: artifact
          if-no-files-found: error
          retention-days: 7

  device:
    name: ${{ matrix.label }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Pixel 9a · Android 16
            profile: pixel9a
            api: '36'
            image: google_apis
            width: '1080'
            height: '2424'
            density: '422'
            ram: '4096'
            rotation: '0'
          - label: Pixel 8a · Android 16
            profile: pixel8a
            api: '36'
            image: google_apis
            width: '1080'
            height: '2400'
            density: '430'
            ram: '4096'
            rotation: '0'
          - label: Galaxy Tab S5e LTE · LineageOS 22.2 equivalent
            profile: tabs5e
            api: '35'
            image: default
            width: '1600'
            height: '2560'
            density: '288'
            ram: '3072'
            rotation: '1'

    steps:
      - name: Download verified build
        uses: actions/download-artifact@v4
        with:
          name: decimen-hardened-v2
          path: artifact

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install emulator image
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "emulator" \
            "system-images;android-${{ matrix.api }};${{ matrix.image }};x86_64"
          sudo chmod 666 /dev/kvm || true

      - name: Boot target-shaped emulator
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="system-images;android-${{ matrix.api }};${{ matrix.image }};x86_64"
          echo no | avdmanager create avd --force --name decimen-test --package "$IMAGE" --device pixel_8
          CONFIG="$HOME/.android/avd/decimen-test.avd/config.ini"
          {
            echo 'hw.cpu.ncore=4'
            echo 'hw.keyboard=yes'
            echo 'hw.gpu.enabled=yes'
            echo 'hw.gpu.mode=swiftshader_indirect'
            echo 'hw.camera.back=virtualscene'
            echo 'hw.camera.front=none'
            echo 'disk.dataPartition.size=8G'
            echo 'skin.dynamic=yes'
            echo 'showDeviceFrame=no'
            echo 'hw.ramSize=${{ matrix.ram }}'
          } >> "$CONFIG"

          nohup emulator @decimen-test \
            -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data \
            -gpu swiftshader_indirect -camera-back virtualscene -camera-front none \
            -memory ${{ matrix.ram }} -cores 4 -no-metrics \
            > emulator.log 2>&1 &
          adb wait-for-device
          for attempt in $(seq 1 240); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = '1' ]; then break; fi
            if [ "$attempt" = 240 ]; then cat emulator.log; exit 1; fi
            sleep 2
          done
          adb shell input keyevent 82 || true
          adb shell wm size '${{ matrix.width }}x${{ matrix.height }}'
          adb shell wm density '${{ matrix.density }}'
          adb shell settings put system accelerometer_rotation 0
          adb shell settings put system user_rotation '${{ matrix.rotation }}'
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell settings put global stay_on_while_plugged_in 3
          adb shell getprop > device-properties.txt

      - name: Run instrumented compatibility and security test
        shell: bash
        run: |
          set -euo pipefail
          adb logcat -c
          adb install -r -t artifact/app-debug.apk
          adb install -r -t artifact/app-debug-androidTest.apk
          adb shell pm grant dev.decimen.optical.debug android.permission.CAMERA
          timeout 600 adb shell am instrument -w -r \
            -e class dev.decimen.optical.DeviceCompatibilityTest \
            -e profile '${{ matrix.profile }}' \
            -e expected_sdk '${{ matrix.api }}' \
            -e expected_width '${{ matrix.width }}' \
            -e expected_height '${{ matrix.height }}' \
            dev.decimen.optical.debug.test/androidx.test.runner.AndroidJUnitRunner \
            | tee instrumentation.txt
          grep -q '^OK (' instrumentation.txt

      - name: Smoke-test signed release
        shell: bash
        run: |
          set -euo pipefail
          adb uninstall dev.decimen.optical.debug.test || true
          adb uninstall dev.decimen.optical.debug || true
          adb install artifact/Decimen-Optical-Transfer-0.2.0-hardened.apk
          adb shell am start -W -n dev.decimen.optical/.MainActivity | tee release-launch.txt
          sleep 15
          test -n "$(adb shell pidof dev.decimen.optical | tr -d '\r')"
          adb shell dumpsys package dev.decimen.optical > release-package.txt
          grep -q 'android.permission.CAMERA' release-package.txt
          ! grep -q 'android.permission.INTERNET' release-package.txt
          adb exec-out screencap -p > release-${{ matrix.profile }}.png

      - name: Collect target evidence
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          adb logcat -d -v threadtime > evidence/logcat.txt || true
          adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || true
          adb pull /sdcard/window.xml evidence/window.xml || true
          adb pull /sdcard/Android/data/dev.decimen.optical.debug/files evidence/debug-files || true
          cp instrumentation.txt release-launch.txt release-package.txt \
            release-${{ matrix.profile }}.png device-properties.txt emulator.log \
            evidence/ 2>/dev/null || true
          if grep -E 'FATAL EXCEPTION.*dev\.decimen|Process: dev\.decimen.*FATAL' evidence/logcat.txt; then
            echo 'Fatal application exception detected.' >&2
            exit 1
          fi

      - name: Upload target evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-${{ matrix.profile }}-evidence-v2
          path: evidence
          if-no-files-found: warn
          retention-days: 7
