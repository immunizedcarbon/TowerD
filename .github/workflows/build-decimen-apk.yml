name: Build Decimen APK

on:
  push:
    branches:
      - decimen-apk-build
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out build workspace
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build web application
        shell: bash
        run: |
          git clone --depth 1 https://github.com/bashalarmistalt/decimen-optical-transfer.git upstream
          cd upstream
          npm ci
          npm run build
          sed -i 's#href="./send/"#href="./send/index.html"#g; s#href="./receive/"#href="./receive/index.html"#g' dist/index.html

      - name: Generate Android wrapper project
        shell: bash
        run: |
          mkdir -p android-wrapper/app/src/main/java/com/decimen/opticaltransfer
          mkdir -p android-wrapper/app/src/main/assets/www
          cp -R upstream/dist/. android-wrapper/app/src/main/assets/www/

          cat > android-wrapper/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'DecimenOpticalTransfer'
          include ':app'
          EOF

          cat > android-wrapper/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > android-wrapper/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.decimen.opticaltransfer'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.decimen.opticaltransfer'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '0.1.0'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.webkit:webkit:1.11.0'
          }
          EOF

          cat > android-wrapper/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-feature android:name="android.hardware.camera.any" android:required="false" />

              <application
                  android:allowBackup="false"
                  android:label="Decimen Optical Transfer"
                  android:usesCleartextTraffic="false"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="keyboardHidden|orientation|screenSize"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > android-wrapper/app/src/main/java/com/decimen/opticaltransfer/MainActivity.java <<'EOF'
          package com.decimen.opticaltransfer;

          import android.Manifest;
          import android.app.Activity;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.WindowManager;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;

          import androidx.annotation.NonNull;
          import androidx.webkit.WebViewAssetLoader;
          import androidx.webkit.WebViewClientCompat;

          public class MainActivity extends Activity {
              private static final int CAMERA_REQUEST_CODE = 42;
              private WebView webView;
              private PermissionRequest pendingCameraRequest;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setAllowFileAccess(false);
                  settings.setAllowContentAccess(false);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);

                  WebView.setWebContentsDebuggingEnabled(false);

                  WebViewAssetLoader assetLoader = new WebViewAssetLoader.Builder()
                          .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                          .build();

                  webView.setWebViewClient(new WebViewClientCompat() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(
                              @NonNull WebView view,
                              @NonNull WebResourceRequest request) {
                          return assetLoader.shouldInterceptRequest(request.getUrl());
                      }

                      @Override
                      @SuppressWarnings("deprecation")
                      public WebResourceResponse shouldInterceptRequest(
                              @NonNull WebView view,
                              @NonNull String url) {
                          return assetLoader.shouldInterceptRequest(Uri.parse(url));
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(PermissionRequest request) {
                          runOnUiThread(() -> handleWebPermissionRequest(request));
                      }
                  });

                  if (checkSelfPermission(Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{Manifest.permission.CAMERA}, CAMERA_REQUEST_CODE);
                  }

                  webView.loadUrl("https://appassets.androidplatform.net/assets/www/index.html");
              }

              private void handleWebPermissionRequest(PermissionRequest request) {
                  boolean wantsCamera = false;
                  for (String resource : request.getResources()) {
                      if (PermissionRequest.RESOURCE_VIDEO_CAPTURE.equals(resource)) {
                          wantsCamera = true;
                          break;
                      }
                  }

                  if (!wantsCamera) {
                      request.deny();
                      return;
                  }

                  if (checkSelfPermission(Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED) {
                      request.grant(new String[]{PermissionRequest.RESOURCE_VIDEO_CAPTURE});
                  } else {
                      pendingCameraRequest = request;
                      requestPermissions(new String[]{Manifest.permission.CAMERA}, CAMERA_REQUEST_CODE);
                  }
              }

              @Override
              public void onRequestPermissionsResult(
                      int requestCode,
                      @NonNull String[] permissions,
                      @NonNull int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode != CAMERA_REQUEST_CODE || pendingCameraRequest == null) {
                      return;
                  }

                  if (grantResults.length > 0 && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                      pendingCameraRequest.grant(new String[]{PermissionRequest.RESOURCE_VIDEO_CAPTURE});
                  } else {
                      pendingCameraRequest.deny();
                  }
                  pendingCameraRequest = null;
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.destroy();
                  }
                  super.onDestroy();
              }
          }
          EOF

      - name: Build debug APK
        working-directory: android-wrapper
        shell: bash
        run: gradle --no-daemon :app:assembleDebug

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p output
          cp android-wrapper/app/build/outputs/apk/debug/app-debug.apk output/decimen-optical-transfer-0.1.0-debug.apk
          sha256sum output/decimen-optical-transfer-0.1.0-debug.apk | tee output/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: decimen-optical-transfer-apk
          path: output/
          if-no-files-found: error
          retention-days: 7
