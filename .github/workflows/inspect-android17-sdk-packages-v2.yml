name: Inspect Android 17 SDK packages v2

on:
  push:
    branches:
      - "chatgpt/rust-calculator-android17"
    paths:
      - ".github/workflows/inspect-android17-sdk-packages-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Android CLI
        shell: bash
        run: |
          set -euxo pipefail
          curl --fail --location --retry 5 \
            "https://dl.google.com/android/cli/latest/linux_x86_64/install.sh" \
            | bash

      - name: Inspect complete package catalog
        shell: bash
        run: |
          set -euxo pipefail
          SDK_ROOT="${RUNNER_TEMP}/android-sdk"
          mkdir -p "${SDK_ROOT}"
          "${HOME}/.local/bin/android" --no-metrics --sdk="${SDK_ROOT}" sdk list '.*' --all --all-versions --canary > all-sdk-packages.txt
          grep -Ei 'platform|android.?37|cinnamon|api.?37' all-sdk-packages.txt | tee android17-matches.txt || true
          test -s android17-matches.txt
