name: Build Rust Calculator Android 17

on:
  push:
    branches:
      - "chatgpt/rust-calculator-android17"
    paths:
      - "rust-calculator-android17/**"
      - ".github/workflows/build-rust-calculator-android17.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Android 17 SDK and NDK
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-37" \
            "build-tools;37.0.0" \
            "ndk;29.0.14206865"

      - name: Install cargo-apk
        shell: bash
        run: |
          set -euxo pipefail
          cargo install \
            --git https://github.com/parasyte/cargo-apk.git \
            --rev 282639508eeed7d73f2e1eaeea042da2716436d5 \
            cargo-apk

      - name: Build release APK
        shell: bash
        working-directory: rust-calculator-android17
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
        run: |
          set -euxo pipefail
          cargo apk build --release --lib
          find target -type f -name '*.apk' -print

      - name: Verify and collect APK
        shell: bash
        working-directory: rust-calculator-android17
        run: |
          set -euxo pipefail
          mkdir -p dist
          APK="$(find target -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" dist/RustCalculator-Android17.apk

          "${ANDROID_HOME}/build-tools/37.0.0/apksigner" verify \
            --verbose \
            --print-certs \
            dist/RustCalculator-Android17.apk \
            | tee dist/signature-verification.txt

          "${ANDROID_HOME}/build-tools/37.0.0/aapt" dump badging \
            dist/RustCalculator-Android17.apk \
            | tee dist/apk-badging.txt

          unzip -l dist/RustCalculator-Android17.apk \
            | tee dist/apk-contents.txt

          sha256sum dist/RustCalculator-Android17.apk \
            | tee dist/RustCalculator-Android17.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RustCalculator-Android17
          path: rust-calculator-android17/dist/*
          if-no-files-found: error
          retention-days: 7
